<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vigil Data Model</title>
<!-- Generated by `make erd` from the backend models (backend/app/db/erd.py). Do not edit by hand. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Tokens follow the Vigil frontend (frontend/app/globals.css). */
  :root {
    --bg: #f7f9fa; --card: #ffffff; --fg: #1a2332; --muted: #f0f3f5; --muted-fg: #52606f;
    --border: #d9dfe6; --primary: #127069; --primary-bg: #e8f5f4; --ring: #1b8d85;
    --onc: #5b3aa3; --onc-bg: #f3effd; --onc-bd: #cdc0ec;
    --cau: #8a4a06; --cau-bg: #fdf3d8; --cau-bd: #ebc77e;
    --neg: #a82424; --neg-bg: #fdf0f0; --neg-bd: #f0c4c4;
    --neu: #515c6b; --neu-bg: #eef1f4; --neu-bd: #d3d9e0;
    --edge: #9aa7b4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --card: #151c25; --fg: #e6ebf0; --muted: #1b232e; --muted-fg: #9ba7b5;
      --border: #2a3441; --primary: #45bdb2; --primary-bg: #16302f; --ring: #62d0c5;
      --onc: #c9b6f7; --onc-bg: #251d3b; --onc-bd: #4a3d73;
      --cau: #f2c265; --cau-bg: #2f2511; --cau-bd: #6b5427;
      --neg: #f29b9b; --neg-bg: #33191b; --neg-bd: #6e3437;
      --neu: #aeb8c4; --neu-bg: #1e2631; --neu-bd: #3a4553;
      --edge: #4d5a69;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --card: #151c25; --fg: #e6ebf0; --muted: #1b232e; --muted-fg: #9ba7b5;
    --border: #2a3441; --primary: #45bdb2; --primary-bg: #16302f; --ring: #62d0c5;
    --onc: #c9b6f7; --onc-bg: #251d3b; --onc-bd: #4a3d73;
    --cau: #f2c265; --cau-bg: #2f2511; --cau-bd: #6b5427;
    --neg: #f29b9b; --neg-bg: #33191b; --neg-bd: #6e3437;
    --neu: #aeb8c4; --neu-bg: #1e2631; --neu-bd: #3a4553;
    --edge: #4d5a69;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  table { font-size: inherit; border-collapse: collapse; }
  code, .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  a { color: var(--primary); }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  button { font: inherit; color: inherit; }

  .top {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card);
  }
  .top h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .top .counts { color: var(--muted-fg); font-size: 13px; }
  .top .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }

  .shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  .rail {
    border-right: 1px solid var(--border); background: var(--card);
    position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - 56px); overflow-y: auto;
    padding: 12px 10px 24px;
  }
  .search {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  .toggle { display: flex; align-items: center; gap: 8px; margin: 10px 2px 4px; font-size: 12.5px; color: var(--muted-fg); }
  .module-head {
    margin: 16px 4px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted-fg);
  }
  .area-head { margin: 10px 6px 2px; font-size: 12px; font-weight: 500; color: var(--muted-fg); }
  .rail ul { list-style: none; margin: 0; padding: 0; }
  .rail li button {
    display: flex; width: 100%; align-items: center; gap: 6px; text-align: left;
    padding: 3px 8px; border: 0; border-radius: 5px; background: none; cursor: pointer;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px;
  }
  .rail li button:hover { background: var(--muted); }
  .rail li button[aria-current="true"] { background: var(--primary-bg); color: var(--primary); font-weight: 500; }
  .rail li .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-left: auto; }
  .empty { padding: 8px; color: var(--muted-fg); font-size: 13px; }

  main { padding: 20px 24px 64px; min-width: 0; display: grid; gap: 22px; align-content: start; }
  .title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
  .title-row h2 { margin: 0; font: 600 22px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .title-row h2 .schema { color: var(--neg); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500; border: 1px solid var(--neu-bd); background: var(--neu-bg); color: var(--neu);
    white-space: nowrap;
  }
  .chip.core { border-color: color-mix(in srgb, var(--primary) 35%, transparent); background: var(--primary-bg); color: var(--primary); }
  .chip.oncology { border-color: var(--onc-bd); background: var(--onc-bg); color: var(--onc); }
  .chip.immutable { border-color: var(--cau-bd); background: var(--cau-bg); color: var(--cau); }
  .chip.identity { border-color: var(--neg-bd); background: var(--neg-bg); color: var(--neg); }
  .doc { margin: 8px 0 0; max-width: 72ch; color: var(--muted-fg); text-wrap: pretty; }

  section h3 {
    margin: 0 0 8px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted-fg);
  }
  .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  .scroll { overflow-x: auto; }

  .diagram { padding: 12px; }
  .diagram svg { display: block; max-width: none; }
  .diagram .node rect { fill: var(--card); stroke: var(--border); }
  .diagram .node.core rect { stroke: color-mix(in srgb, var(--primary) 45%, var(--border)); }
  .diagram .node.oncology rect { stroke: var(--onc-bd); fill: var(--onc-bg); }
  .diagram .node.center rect { fill: var(--primary-bg); stroke: var(--primary); stroke-width: 1.5; }
  .diagram .node.center.oncology rect { fill: var(--onc-bg); stroke: var(--onc); }
  .diagram .node text { fill: var(--fg); font: 500 12.5px "IBM Plex Mono", ui-monospace, monospace; }
  .diagram .node .via { fill: var(--muted-fg); font: 11px "IBM Plex Sans", system-ui, sans-serif; }
  .diagram .node.link { cursor: pointer; }
  .diagram .node.link:hover rect, .diagram .node.link:focus-visible rect { stroke: var(--ring); stroke-width: 1.5; }
  .diagram .node.more text { fill: var(--muted-fg); font-family: "IBM Plex Sans", system-ui, sans-serif; }
  .diagram path { fill: none; stroke: var(--edge); stroke-width: 1.2; }
  .diagram .lane { fill: var(--muted-fg); font: 600 10.5px "IBM Plex Sans", system-ui, sans-serif; letter-spacing: 0.08em; }

  table.cols { width: 100%; }
  table.cols th, table.cols td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  table.cols th { font-size: 11.5px; font-weight: 600; color: var(--muted-fg); background: var(--muted); white-space: nowrap; }
  table.cols tr:last-child td { border-bottom: 0; }
  table.cols td.name { font-family: "IBM Plex Mono", ui-monospace, monospace; white-space: nowrap; }
  table.cols td.type { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--muted-fg); white-space: nowrap; }
  table.cols tr.standard td { color: var(--muted-fg); }
  .req { font-size: 12px; color: var(--muted-fg); white-space: nowrap; }
  .req.yes { color: var(--fg); font-weight: 500; }
  .values { display: flex; flex-wrap: wrap; gap: 4px; }
  .value { font: 11.5px "IBM Plex Mono", ui-monospace, monospace; padding: 0 6px; border-radius: 4px; background: var(--muted); border: 1px solid var(--border); }
  .ref { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .pk { font-size: 10.5px; font-weight: 600; color: var(--primary); margin-left: 6px; letter-spacing: 0.04em; }

  .rules { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .rules ul { list-style: none; margin: 0; padding: 4px 0; }
  .rules li { padding: 7px 12px; border-bottom: 1px solid var(--border); display: grid; gap: 3px; }
  .rules li:last-child { border-bottom: 0; }
  .rules li code { font-size: 12px; overflow-wrap: anywhere; }
  .rules .meta { font-size: 12px; color: var(--muted-fg); }
  .rules .none { color: var(--muted-fg); padding: 10px 12px; font-size: 13px; }

  @media (max-width: 820px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { position: static; height: auto; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--border); }
    main { padding: 16px 16px 48px; }
    .top { padding: 12px 16px; }
    .top .legend { margin-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .rail li button, .diagram .node rect { transition: background-color 120ms, stroke 120ms; }
  }
</style>

<header class="top">
  <h1>Vigil data model</h1>
  <span class="counts" id="counts"></span>
  <div class="legend" aria-label="Legend">
    <span class="chip core">Core</span>
    <span class="chip oncology">Oncology module</span>
    <span class="chip">Practice data · Support data · Shared reference</span>
    <span class="chip immutable">Never changes once written</span>
    <span class="chip identity">identity schema: restricted</span>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Tables">
    <input id="search" class="search" type="search" placeholder="Find a table or column…" aria-label="Find a table or column" autocomplete="off">
    <label class="toggle" for="hide-plumbing">
      <input id="hide-plumbing" type="checkbox" checked>
      Hide Practice and soft-delete links
    </label>
    <div id="list"></div>
  </nav>
  <main id="main" aria-live="polite"></main>
</div>

<script>
const DATA = /*__VIGIL_DATA_MODEL__*/null;

const byName = new Map(DATA.map(t => [t.name, t]));
// Links every table carries (Practice scoping, who soft-deleted it). Hidden by default: they'd bury the domain links.
const PLUMBING = new Set(["practice_id", "deleted_by_user_id"]);
const SCOPE_LABEL = { practice: "Practice data", support: "Support data", shared: "Shared reference data" };

const referencedBy = new Map(DATA.map(t => [t.name, []]));
for (const t of DATA) {
  for (const fk of t.foreignKeys) {
    if (fk.table !== t.name || fk.columns[0] !== "deleted_by_user_id") {
      referencedBy.get(fk.table)?.push({ table: t.name, columns: fk.columns, onDelete: fk.onDelete, composite: fk.composite });
    }
  }
}

const els = {
  list: document.getElementById("list"),
  main: document.getElementById("main"),
  search: document.getElementById("search"),
  plumbing: document.getElementById("hide-plumbing"),
};
let current = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hidePlumbing() { return els.plumbing.checked; }
function isPlumbing(fk) { return PLUMBING.has(fk.columns[0]); }

function outgoing(t) {
  const seen = new Map();
  for (const fk of t.foreignKeys) {
    if (hidePlumbing() && isPlumbing(fk)) continue;
    if (fk.table === t.name && fk.columns[0] === "deleted_by_user_id") continue;
    const entry = seen.get(fk.table) || { table: fk.table, via: [] };
    entry.via.push(fk.columns[0]);
    seen.set(fk.table, entry);
  }
  return [...seen.values()].sort((a, b) => a.table.localeCompare(b.table));
}
function incoming(t) {
  const seen = new Map();
  for (const r of referencedBy.get(t.name)) {
    if (hidePlumbing() && PLUMBING.has(r.columns[0])) continue;
    const entry = seen.get(r.table) || { table: r.table, via: [] };
    entry.via.push(r.columns[0]);
    seen.set(r.table, entry);
  }
  return [...seen.values()].sort((a, b) => a.table.localeCompare(b.table));
}

function renderList() {
  const q = els.search.value.trim().toLowerCase();
  const matches = DATA.filter(t => !q || t.name.includes(q) || t.columns.some(c => c.name.includes(q)));
  if (!matches.length) { els.list.innerHTML = `<p class="empty">No table or column matches “${esc(q)}”.</p>`; return; }
  let html = "", module = null, area = null;
  for (const t of matches) {
    if (t.module !== module) {
      if (area !== null) html += "</ul>";
      module = t.module; area = null;
      html += `<div class="module-head">${module === "Core" ? "Core" : "Oncology module"}</div>`;
    }
    if (t.area !== area) {
      if (area !== null) html += "</ul>";
      area = t.area;
      if (module === "Core") html += `<div class="area-head">${esc(area)}</div>`;
      html += "<ul>";
    }
    const dot = t.immutable ? `<span class="dot" style="background:var(--cau)" title="Never changes once written"></span>`
      : t.schema ? `<span class="dot" style="background:var(--neg)" title="identity schema"></span>` : "";
    html += `<li><button type="button" data-table="${t.name}" aria-current="${t.name === current}">${esc(t.name)}${dot}</button></li>`;
  }
  html += "</ul>";
  els.list.innerHTML = html;
}

function nodeBox(x, y, w, name, via, cls) {
  const t = byName.get(name);
  const kind = t ? t.module.toLowerCase() : "";
  const h = via ? 40 : 30;
  const label = name.length > 26 ? name.slice(0, 25) + "…" : name;
  return `<g class="node link ${kind} ${cls}" data-table="${name}" tabindex="0" role="link" aria-label="Open ${name}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6"></rect>
    <text x="${x + 10}" y="${y + 19}">${esc(label)}</text>
    ${via ? `<text class="via" x="${x + 10}" y="${y + 33}">via ${esc(via.join(", ")).slice(0, 34)}</text>` : ""}
  </g>`;
}

function renderDiagram(t) {
  const left = outgoing(t), right = incoming(t);
  const MAX = 14;
  const W = 214, GAP = 60, CW = 230;
  const width = W * 2 + CW + GAP * 2 + 8;
  const rowH = 48;
  const lcount = Math.min(left.length, MAX) + (left.length > MAX ? 1 : 0);
  const rcount = Math.min(right.length, MAX) + (right.length > MAX ? 1 : 0);
  const rows = Math.max(lcount, rcount, 1);
  const height = rows * rowH + 34;
  const cx = W + GAP + 4, cy = height / 2 - 20;
  let svg = `<text class="lane" x="4" y="14">POINTS TO</text>
    <text class="lane" x="${width - 4}" y="14" text-anchor="end">POINTED TO BY</text>`;
  const place = (items, x, side) => {
    const shown = items.slice(0, MAX);
    const total = shown.length + (items.length > MAX ? 1 : 0);
    const top = 26 + (rows - total) * rowH / 2;
    shown.forEach((item, i) => {
      const y = top + i * rowH;
      const ny = y + 20;
      const from = side === "left" ? `${x + W},${ny}` : `${x},${ny}`;
      const to = side === "left" ? `${cx},${cy + 20}` : `${cx + CW},${cy + 20}`;
      const [fx, fy] = from.split(",").map(Number), [tx, ty] = to.split(",").map(Number);
      const mid = (fx + tx) / 2;
      svg += `<path d="M${fx},${fy} C${mid},${fy} ${mid},${ty} ${tx},${ty}"></path>`;
      svg += nodeBox(x, y, W, item.table, item.via, "");
    });
    if (items.length > MAX) {
      const y = top + shown.length * rowH;
      svg += `<g class="node more"><rect x="${x}" y="${y}" width="${W}" height="30" rx="6"></rect>
        <text x="${x + 10}" y="${y + 19}">+ ${items.length - MAX} more, listed below</text></g>`;
    }
  };
  place(left, 4, "left");
  place(right, width - W - 4, "right");
  if (!left.length) svg += `<text class="lane" x="4" y="${cy + 24}" style="font-weight:400;letter-spacing:0">No links out</text>`;
  if (!right.length) svg += `<text class="lane" x="${width - 4}" y="${cy + 24}" text-anchor="end" style="font-weight:400;letter-spacing:0">Nothing links here</text>`;
  svg += `<g class="node center ${t.module.toLowerCase()}"><rect x="${cx}" y="${cy}" width="${CW}" height="40" rx="7"></rect>
    <text x="${cx + CW / 2}" y="${cy + 25}" text-anchor="middle" style="font-weight:600">${esc(t.name)}</text></g>`;
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img"
    aria-label="Tables linked to ${esc(t.name)}">${svg}</svg>`;
}

function renderColumns(t) {
  const rows = t.columns.map(c => {
    const values = c.allowed.length ? `<div class="values">${c.allowed.map(v => `<span class="value">${esc(v)}</span>`).join("")}</div>` : "";
    const ref = c.references ? `<button type="button" class="ref" data-table="${c.references}">${esc(c.references)}</button>` : "";
    const def = c.default ? `<code>${esc(c.default)}</code>` : "";
    return `<tr class="${c.standard ? "standard" : ""}">
      <td class="name">${esc(c.name)}${c.name === "id" ? '<span class="pk">PK</span>' : ""}</td>
      <td class="type">${esc(c.type)}</td>
      <td><span class="req ${c.nullable ? "" : "yes"}">${c.nullable ? "optional" : "required"}</span></td>
      <td>${ref}</td>
      <td>${values || def}</td>
    </tr>`;
  }).join("");
  return `<div class="panel scroll"><table class="cols">
    <thead><tr><th>Column</th><th>Type</th><th>Value</th><th>Points to</th><th>Allowed values / default</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function listPanel(title, items, empty) {
  return `<section><h3>${title}</h3><div class="panel">${items.length ? `<ul>${items.join("")}</ul>` : `<p class="none">${empty}</p>`}</div></section>`;
}

function renderRules(t) {
  const fks = t.foreignKeys.map(fk => `<li>
      <code>(${esc(fk.columns.join(", "))}) → <button type="button" class="ref" data-table="${fk.table}">${esc(fk.table)}</button></code>
      <span class="meta">ON DELETE ${esc(fk.onDelete)}${fk.composite ? " · composite: same Practice guaranteed" : ""}</span></li>`);
  const inbound = (referencedBy.get(t.name) || []).map(r => `<li>
      <code><button type="button" class="ref" data-table="${r.table}">${esc(r.table)}</button>.(${esc(r.columns.join(", "))})</code>
      <span class="meta">ON DELETE ${esc(r.onDelete)}</span></li>`);
  const checks = t.checks.map(c => `<li><span class="meta">${esc(c.name)}</span><code>${esc(c.sql)}</code></li>`);
  const uniques = t.uniques.map(u => `<li><code>UNIQUE (${esc(u.join(", "))})</code></li>`);
  const indexes = t.indexes.map(i => `<li><code>${esc(i.on.join(", "))}</code>
      <span class="meta">${i.unique ? "unique · " : ""}${i.using ? esc(i.using) + " · " : ""}${i.where ? "where " + esc(i.where) + " · " : ""}${esc(i.name)}</span></li>`);
  return `<div class="rules">
    ${listPanel("Foreign keys", fks, "None.")}
    ${listPanel(`Referenced by (${inbound.length})`, inbound, "No table points here.")}
    ${listPanel("Checks", checks, "Only the allowed-value and soft-delete checks.")}
    ${listPanel("Unique and indexes", [...uniques, ...indexes], "Primary key only.")}
  </div>`;
}

function show(name, push) {
  const t = byName.get(name) || byName.get("patient");
  current = t.name;
  const chips = [
    `<span class="chip ${t.module.toLowerCase()}">${t.module === "Core" ? "Core" : "Oncology module"}</span>`,
    `<span class="chip">${SCOPE_LABEL[t.scope]}</span>`,
    t.immutable ? `<span class="chip immutable">Never changes once written</span>` : "",
    t.schema ? `<span class="chip identity">identity schema · identity_access role only</span>` : "",
  ].join("");
  els.main.innerHTML = `
    <div>
      <div class="title-row">
        <h2>${t.schema ? `<span class="schema">${esc(t.schema)}.</span>` : ""}${esc(t.name)}</h2>
        <div class="chips">${chips}</div>
      </div>
      ${t.doc ? `<p class="doc">${esc(t.doc)}</p>` : ""}
    </div>
    <section><h3>Relationships · ${esc(t.area)}</h3><div class="panel diagram scroll">${renderDiagram(t)}</div></section>
    <section><h3>Columns (${t.columns.length})</h3>${renderColumns(t)}</section>
    ${renderRules(t)}`;
  if (push && location.hash !== "#" + t.name) history.replaceState(null, "", "#" + t.name);
  renderList();
  const active = els.list.querySelector('[aria-current="true"]');
  if (active && push) active.scrollIntoView({ block: "nearest" });
}

function onPick(event) {
  const target = event.target.closest("[data-table]");
  if (!target || !byName.has(target.dataset.table)) return;
  show(target.dataset.table, true);
  els.main.scrollIntoView({ block: "start" });
}
els.list.addEventListener("click", onPick);
els.main.addEventListener("click", onPick);
els.main.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { if (e.target.closest(".node.link")) { e.preventDefault(); onPick(e); } } });
els.search.addEventListener("input", renderList);
els.plumbing.addEventListener("change", () => show(current, false));
window.addEventListener("hashchange", () => show(location.hash.slice(1), false));

const practiceCount = DATA.filter(t => t.scope === "practice").length;
document.getElementById("counts").textContent =
  `${DATA.length} tables · ${DATA.filter(t => t.module === "Core").length} Core, ${DATA.filter(t => t.module !== "Core").length} Oncology · ${practiceCount} hold Practice data`;
show(location.hash.slice(1) || "patient", false);
</script>
